name: ci

# What CI can and cannot do here.
#
# It runs the whole fast tier: linting, the unit tests, the reward parity check
# between numpy and torch, and a short scripted-expert rollout that is the
# environment's smoke test.
#
# It does not train and it does not render. A full training run is half an hour
# of CPU per seed, and rendering needs a GL context. Those live behind
# `make experiments` and `make videos` and are run by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint
        run: python -m flake8 src/ envs/ tests/ analysis/ experiments/ scripts/

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Scripted expert smoke test
        run: python scripts/offline_demo.py --episodes 20

      - name: Training loop smoke test
        run: |
          python src/train_rl.py --steps 2000 --start-steps 500 \
            --eval-every 1000 --eval-episodes 5 --output /tmp/ci_run
          test -f /tmp/ci_run/result.json

      - name: Imitation smoke test
        run: |
          python src/record_demos.py --episodes 5 --randomisation none \
            --output /tmp/ci_demos.npz
          python src/train_il.py --demos /tmp/ci_demos.npz --epochs 3 \
            --eval-episodes 5 --output /tmp/ci_bc
          test -f /tmp/ci_bc/result.json
